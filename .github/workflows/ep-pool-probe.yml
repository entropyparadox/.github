name: ep-pool-probe

# Manual probe for the EP build pool (Task 60): one light and one heavy job routed through ep-pick.
# Shows where each job ran (grid combo from measured history or the sizes input) and how long it waited. No secrets.
on:
  workflow_dispatch:
    inputs:
      sleep:
        description: Seconds each job stays busy
        default: "20"
      heavy_mib:
        description: MiB the heavy job holds in memory
        default: "3072"
      fail:
        description: Make the heavy job fail at the end (to test the OOM re-run path)
        default: "false"
      sizes:
        description: Optional ep-pick sizes, e.g. {"light":"cpu=2/ram=4"}
        default: "{}"

permissions: {}

jobs:
  pick:
    uses: ./.github/workflows/ep-pick.yml
    with:
      sizes: ${{ inputs.sizes }}
  light:
    needs: pick
    runs-on: ${{ fromJSON(needs.pick.outputs.map)['light'] || fromJSON(needs.pick.outputs.runs-on) }}
    steps:
      - name: Where am I
        shell: bash
        env:
          SLEEP_S: ${{ inputs.sleep }}
        run: |
          echo "job=light runner=$RUNNER_NAME started=$(date -u +%FT%TZ) nproc=$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
          sleep "$SLEEP_S"
  heavy:
    needs: pick
    runs-on: ${{ fromJSON(needs.pick.outputs.map)['heavy'] || fromJSON(needs.pick.outputs.runs-on) }}
    steps:
      - name: Hold memory
        shell: bash
        env:
          SLEEP_S: ${{ inputs.sleep }}
          HEAVY_MIB: ${{ inputs.heavy_mib }}
          FAIL: ${{ inputs.fail }}
        run: |
          echo "job=heavy runner=$RUNNER_NAME started=$(date -u +%FT%TZ) nproc=$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c 'import os, time; b = b"\x01" * (int(os.environ["HEAVY_MIB"]) << 20); time.sleep(int(os.environ["SLEEP_S"]))'
          [ "$FAIL" != "true" ]
